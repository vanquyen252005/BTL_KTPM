spring.application.name=apigateway
server.port=9091

# ================================
# Eureka client config
# ================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}

# ================================
# Redis configuration for rate limiting
# ================================
spring.data.redis.host=localhost
spring.data.redis.port=6380
spring.data.redis.password=
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# ================================
# ENABLE DISCOVERY LOCATOR
# ================================
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# ================================
# GATEWAY TIMEOUT (RẤT QUAN TRỌNG)
# ================================
# Timeout khi GATEWAY CALL ĐẾN BORROWER-SERVICE
spring.cloud.gateway.httpclient.connect-timeout=2000
spring.cloud.gateway.httpclient.response-timeout=3s
# ⬆⬆⬆ NHỜ 2 dòng này mà Gateway sẽ timeout sau 3s,
# và Circuit Breaker coi đó là FAILURE → CB sẽ mở đúng.

# ================================
# DEFAULT CIRCUIT BREAKER (ÁP DỤNG CHO TẤT CẢ ROUTES)
# ================================
spring.cloud.gateway.default-filters[0].name=CircuitBreaker
spring.cloud.gateway.default-filters[0].args.name=defaultCircuitBreaker
spring.cloud.gateway.default-filters[0].args.fallbackUri=forward:/fallback/default

# ================================
# RESILIENCE4J CONFIG
# ================================
resilience4j.circuitbreaker.instances.defaultCircuitBreaker.register-health-indicator=true
resilience4j.circuitbreaker.instances.defaultCircuitBreaker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.defaultCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.defaultCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.defaultCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.defaultCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.defaultCircuitBreaker.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.defaultCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true

# TimeLimiter chỉ hoạt động khi Gateway timeout HTTP client
resilience4j.timelimiter.instances.defaultCircuitBreaker.timeout-duration=3s
resilience4j.timelimiter.instances.defaultCircuitBreaker.cancel-running-future=true

# Tắt toàn bộ log gateway để không bị spam
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.cloud.gateway.route=INFO
logging.level.org.springframework.cloud.gateway.filter=INFO

# Tắt bớt log của project
logging.level.com.example=INFO

# BẬT CHỈ log circuit breaker
logging.level.io.github.resilience4j=DEBUG
logging.level.io.github.resilience4j.circuitbreaker=DEBUG
